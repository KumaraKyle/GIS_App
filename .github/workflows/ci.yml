name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 3.11 matches Raspberry Pi OS Bookworm, which is what actually runs this.
      - run: uv venv --python 3.11
      - run: uv pip install -e ".[dev]"

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      # Hardware-marked tests are deselected by pyproject's addopts; everything
      # else runs against the synthetic source, so CI needs no radios.
      - name: Test
        run: uv run pytest -q

  firmware-header:
    # The C header and the Python decoder describe the same bytes. Compiling the
    # header on its own catches a broken _Static_assert on the struct sizes
    # without needing the full ESP-IDF toolchain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check wire format struct sizes
        run: |
          echo '#include "firmware/common/csi_wire.h"' > /tmp/check.c
          echo 'int main(void) { return 0; }' >> /tmp/check.c
          gcc -I. -Wall -Wextra -Werror -o /tmp/check /tmp/check.c
          /tmp/check
