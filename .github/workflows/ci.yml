name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 3.11 matches Raspberry Pi OS Bookworm, which is what actually runs this.
      - run: uv venv --python 3.11
      # edge brings pyarrow (recorder tests) and web brings FastAPI. Not [ml]:
      # torch is training-only and must never be a runtime dependency.
      - run: uv pip install -e ".[dev,edge,web]"

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      # Fast feedback first: unit tests are seconds, the golden acceptance
      # sweeps are minutes.
      - name: Unit tests
        run: uv run pytest tests/unit -q

      # Hardware-marked tests are deselected by pyproject's addopts; everything
      # else runs against the synthetic source, so CI needs no radios.
      - name: Acceptance tests
        run: uv run pytest tests/golden -q

  dashboard:
    # The dashboard is a hand-written page, not a build artefact, so there is
    # nothing to compile -- but a syntax error in it would only show up in a
    # browser, so parse it here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse dashboard script
        run: |
          python3 - <<'EOF' > /tmp/dashboard.js
          import re, pathlib
          html = pathlib.Path("src/csisense/web/static/index.html").read_text()
          m = re.search(r"<script>(.*)</script>", html, re.S)
          assert m, "no script block found in index.html"
          print(m.group(1))
          EOF
          node --check /tmp/dashboard.js

  firmware-header:
    # The C header and the Python decoder describe the same bytes. Compiling the
    # header on its own catches a broken _Static_assert on the struct sizes
    # without needing the full ESP-IDF toolchain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check wire format struct sizes
        run: |
          echo '#include "firmware/common/csi_wire.h"' > /tmp/check.c
          echo 'int main(void) { return 0; }' >> /tmp/check.c
          gcc -I. -Wall -Wextra -Werror -o /tmp/check /tmp/check.c
          /tmp/check
